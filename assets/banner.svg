<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Stream Glow Gradient -->
    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="streamGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="35%" stop-color="#a5b4fc" />
      <stop offset="70%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowSubtle" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Continuous Stream Wave Animation */
    @keyframes flowDashes {
      0% {
        stroke-dashoffset: 600;
      }
      100% {
        stroke-dashoffset: 0;
      }
    }

    /* Pulsing Nodes Animation */
    @keyframes pulseNode {
      0%, 100% {
        transform: scale(1);
        opacity: 0.6;
      }
      50% {
        transform: scale(1.4);
        opacity: 1;
      }
    }

    /* Floating Data Packets */
    @keyframes floatPacket {
      0% {
        transform: translateY(0px) scale(0.9);
      }
      50% {
        transform: translateY(-8px) scale(1.05);
      }
      100% {
        transform: translateY(0px) scale(0.9);
      }
    }

    /* Ambient Glow Oscillation */
    @keyframes ambientGlow {
      0%, 100% {
        opacity: 0.25;
      }
      50% {
        opacity: 0.55;
      }
    }

    .stream-line-1 {
      stroke: url(#streamGrad1);
      stroke-width: 3.5;
      fill: none;
      stroke-dasharray: 18 12;
      animation: flowDashes 14s linear infinite;
    }

    .stream-line-2 {
      stroke: url(#streamGrad2);
      stroke-width: 2.5;
      fill: none;
      stroke-dasharray: 12 8;
      animation: flowDashes 10s linear infinite reverse;
    }

    .ambient-sphere {
      animation: ambientGlow 6s ease-in-out infinite;
    }

    .pulsing-dot {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulseNode 3s ease-in-out infinite;
    }

    .dot-delay-1 { animation-delay: 0.5s; }
    .dot-delay-2 { animation-delay: 1.2s; }
    .dot-delay-3 { animation-delay: 1.9s; }
    .dot-delay-4 { animation-delay: 2.4s; }

    .floating-card {
      animation: floatPacket 5s ease-in-out infinite;
    }
    .card-delay {
      animation-delay: 2.5s;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1000" height="320" rx="16" fill="url(#bgGrad)" />
  <rect width="998" height="318" x="1" y="1" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Background Ambient Glows -->
  <circle cx="200" cy="160" r="140" fill="#4f46e5" filter="url(#glow)" opacity="0.18" class="ambient-sphere" />
  <circle cx="800" cy="140" r="150" fill="#06b6d4" filter="url(#glow)" opacity="0.15" class="ambient-sphere" />
  <circle cx="500" cy="270" r="120" fill="#ec4899" filter="url(#glow)" opacity="0.12" class="ambient-sphere" />

  <!-- Animated Stream Pipeline Lines in Background -->
  <path d="M -50 70 Q 250 15, 500 80 T 1050 50" class="stream-line-1" />
  <path d="M -50 250 Q 250 310, 500 240 T 1050 270" class="stream-line-2" />
  <path d="M -20 180 C 200 240, 350 120, 600 190 S 850 130, 1030 200" stroke="#6366f1" stroke-opacity="0.15" stroke-width="1.5" fill="none" />

  <!-- Background Stream Nodes (Pulsing) -->
  <circle cx="160" cy="50" r="5" fill="#38bdf8" filter="url(#glowSubtle)" class="pulsing-dot dot-delay-1" />
  <circle cx="480" cy="78" r="6" fill="#818cf8" filter="url(#glowSubtle)" class="pulsing-dot dot-delay-2" />
  <circle cx="820" cy="58" r="5" fill="#c084fc" filter="url(#glowSubtle)" class="pulsing-dot dot-delay-3" />
  <circle cx="260" cy="285" r="5" fill="#34d399" filter="url(#glowSubtle)" class="pulsing-dot dot-delay-4" />
  <circle cx="730" cy="250" r="6" fill="#06b6d4" filter="url(#glowSubtle)" class="pulsing-dot dot-delay-2" />

  <!-- Floating Stream Badges in Background (Non-intrusive) -->
  <g class="floating-card" opacity="0.75" transform="translate(60, 220)">
    <rect width="140" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#10b981" />
    <text x="30" y="18" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">⚡ Exactly-Once</text>
  </g>

  <g class="floating-card card-delay" opacity="0.75" transform="translate(800, 220)">
    <rect width="140" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#38bdf8" />
    <text x="30" y="18" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">⏱️ Event-Time</text>
  </g>

  <!-- Foreground Content Container (Ensures Title & Subtitle Never Hidden) -->
  <!-- Subtle dark backdrop behind center text for supreme contrast and crisp readability -->
  <rect x="120" y="70" width="760" height="150" rx="20" fill="#0b0f19" fill-opacity="0.75" />

  <g text-anchor="middle">
    <!-- Category Pill -->
    <rect x="400" y="85" width="200" height="24" rx="12" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.2" />
    <text x="500" y="101" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">REAL-TIME DATA ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="500" y="152" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">Awesome Stream Processing</text>

    <!-- Subtitle -->
    <text x="500" y="190" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="500">
      Curated Directory of Stateful Engines, Event-Driven Architectures &amp; Cloud Platforms
    </text>
  </g>
</svg>
