<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1000 320"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#080c14"/></linearGradient><linearGradient id="streamGrad1" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".2"/><stop offset="50%" stop-color="#818cf8" stop-opacity=".9"/><stop offset="100%" stop-color="#c084fc" stop-opacity=".2"/></linearGradient><linearGradient id="streamGrad2" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#34d399" stop-opacity=".1"/><stop offset="50%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".1"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#67e8f9"/><stop offset="35%" stop-color="#a5b4fc"/><stop offset="70%" stop-color="#f472b6"/><stop offset="100%" stop-color="#38bdf8"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="glowSubtle" width="120%" height="120%" x="-10%" y="-10%"><feGaussianBlur result="blur" stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes flowDashes{0%{stroke-dashoffset:600}}@keyframes pulseNode{0%{transform:scale(1);opacity:.6}50%{transform:scale(1.4);opacity:1}}@keyframes floatPacket{0%{transform:translateY(0) scale(.9)}50%{transform:translateY(-8px) scale(1.05)}}@keyframes ambientGlow{0%{opacity:.25}50%{opacity:.55}}.stream-line-1{stroke:url(#streamGrad1);stroke-width:3.5;fill:none;stroke-dasharray:18 12;animation:flowDashes 14s linear infinite}.stream-line-2{stroke:url(#streamGrad2);stroke-width:2.5;fill:none;stroke-dasharray:12 8;animation:flowDashes 10s linear infinite reverse}.ambient-sphere{animation:ambientGlow 6s ease-in-out infinite}.pulsing-dot{transform-box:fill-box;transform-origin:center;animation:pulseNode 3s ease-in-out infinite}.dot-delay-1{animation-delay:.5s}.dot-delay-2{animation-delay:1.2s}.dot-delay-3{animation-delay:1.9s}.dot-delay-4{animation-delay:2.4s}.floating-card{animation:floatPacket 5s ease-in-out infinite}.card-delay{animation-delay:2.5s}</style><rect width="1000" height="320" fill="url(#bgGrad)" rx="16"/><rect width="998" height="318" x="1" y="1" fill="none" stroke="#1e293b" stroke-width="1.5" rx="15"/><circle cx="200" cy="160" r="140" fill="#4f46e5" class="ambient-sphere" filter="url(#glow)" opacity=".18"/><circle cx="800" cy="140" r="150" fill="#06b6d4" class="ambient-sphere" filter="url(#glow)" opacity=".15"/><circle cx="500" cy="270" r="120" fill="#ec4899" class="ambient-sphere" filter="url(#glow)" opacity=".12"/><path d="M -50 70 Q 250 15, 500 80 T 1050 50" class="stream-line-1"/><path d="M -50 250 Q 250 310, 500 240 T 1050 270" class="stream-line-2"/><path fill="none" stroke="#6366f1" stroke-opacity=".15" stroke-width="1.5" d="M -20 180 C 200 240, 350 120, 600 190 S 850 130, 1030 200"/><circle cx="160" cy="50" r="5" fill="#38bdf8" class="pulsing-dot dot-delay-1" filter="url(#glowSubtle)"/><circle cx="480" cy="78" r="6" fill="#818cf8" class="pulsing-dot dot-delay-2" filter="url(#glowSubtle)"/><circle cx="820" cy="58" r="5" fill="#c084fc" class="pulsing-dot dot-delay-3" filter="url(#glowSubtle)"/><circle cx="260" cy="285" r="5" fill="#34d399" class="pulsing-dot dot-delay-4" filter="url(#glowSubtle)"/><circle cx="730" cy="250" r="6" fill="#06b6d4" class="pulsing-dot dot-delay-2" filter="url(#glowSubtle)"/><g class="floating-card" opacity=".75" transform="translate(60, 220)"><rect width="140" height="28" fill="#0f172a" stroke="#334155" stroke-width="1" rx="14"/><circle cx="16" cy="14" r="4" fill="#10b981"/><text x="30" y="18" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">⚡ Exactly-Once</text></g><g class="floating-card card-delay" opacity=".75" transform="translate(800, 220)"><rect width="140" height="28" fill="#0f172a" stroke="#334155" stroke-width="1" rx="14"/><circle cx="16" cy="14" r="4" fill="#38bdf8"/><text x="30" y="18" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">⏱️ Event-Time</text></g><rect width="760" height="150" x="120" y="70" fill="#0b0f19" fill-opacity=".75" rx="20"/><g text-anchor="middle"><rect width="200" height="24" x="400" y="85" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.2" rx="12"/><text x="500" y="101" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">REAL-TIME DATA ECOSYSTEM</text><text x="500" y="152" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-.5">Awesome Stream Processing</text><text x="500" y="190" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="500">Curated Directory of Stateful Engines, Event-Driven Architectures &amp; Cloud Platforms</text></g></svg>